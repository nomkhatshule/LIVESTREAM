# Settings for the Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Lets App Hosting start extra servers when traffic spikes
  # (was 1, which meant one server for everyone).
  minInstances: 0
  maxInstances: 10

env:
  - variable: NODE_ENV
    value: production
    availability: [BUILD, RUNTIME]

  # Public values (also baked into the browser bundle at build time).
  # Fill these in with your NEW keys after rotating the leaked ones.
  - variable: NEXT_PUBLIC_STREAM_API_KEY
    value: "REPLACE_WITH_NEW_STREAM_API_KEY"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ALGOLIA_APP_ID
    value: "REPLACE_WITH_ALGOLIA_APP_ID"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY
    value: "REPLACE_WITH_NEW_ALGOLIA_SEARCH_ONLY_KEY"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GIPHY_API_KEY
    value: "REPLACE_WITH_NEW_GIPHY_KEY"
    availability: [BUILD, RUNTIME]

  # Secret: stored in Google Secret Manager, never in this file. Create it with:
  #   firebase apphosting:secrets:set STREAM_API_SECRET
  - variable: STREAM_API_SECRET
    secret: STREAM_API_SECRET
    availability: [RUNTIME]
