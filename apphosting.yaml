# Settings for the Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Lets App Hosting start extra servers when traffic spikes
  # (was 1, which meant one server for everyone).
  minInstances: 0
  maxInstances: 10

# Do NOT set NODE_ENV here: setting it to "production" during the build makes
# `npm ci` skip devDependencies (TypeScript, Tailwind, PostCSS) and the build
# fails. Next.js sets production mode itself for `next build` and `next start`.
#
# API keys are configured outside this file (never commit real values).
# If you ever want App Hosting to read a secret from Secret Manager, add e.g.:
# env:
#   - variable: STREAM_API_SECRET
#     secret: STREAM_API_SECRET
#     availability: [RUNTIME]
